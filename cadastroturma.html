<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Portfólios - Cadastro Turma</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://kit.fontawesome.com/7f3ade3e1e.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <h1>Gerenciador de Portfólios</h1>

        <div class="div-header">
            <button>
                <a href="index.html">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </a>
            </button>

            <p>Nome do usuário</p>
        </div>
    </header>

     <section class="nav-e-main">
        <nav>
            <ul>
                <li><a href="cadastroturma.html"><i class="fa-solid fa-house"></i> Cadastro Turma</a></li>
                <li><a href="listaturma.html"><i class="fa-solid fa-user"></i> Lista Turma</a></li>
                <li><a href="cadastroaluno.html"><i class="fa-solid fa-list"></i> Cadastro Aluno</a></li>
                <li><a href="listaaluno.html"><i class="fa-solid fa-car"></i> Lista Aluno</a></li>
                <li><a href="cadastroprojeto.html"><i class="fa-regular fa-calendar"></i> Cadastro Projeto</a></li>
                <li><a href="listaprojeto.html"><i class="fa-solid fa-list"></i> Lista Projeto</a></li>
            </ul>
        </nav>
        <main>
            <h2>Cadastro de Turmas</h2>
            <form>
                <h3>Preencha as informações abaixo:</h3>

                <div class="inputgroup">
                    <label for="username"></label>
                    <div class="input-item">
                        <input id="username" type="text" placeholder="Nome:">
                    </div>
                </div>
                <div class="inputgroup">
                    <label for="periodo"></label>
                    <div class="input-item">
                        <input id="periodo" type="text" placeholder="Período:">
                    </div>
                </div>
                <div class="inputgroup">
                    <label for="teacher"></label>
                    <div class="input-item">
                        <input id="teacher" type="text" placeholder="Professor:">
                    </div>
                </div>
                <button class="btn-finalizar">Finalizar cadastro</button>
            </form>
        </main>
    </section>
</body>

</html>
